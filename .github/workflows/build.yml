name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.2.0). Empty = auto-bump the latest v* tag."
        required: false
        type: string

permissions:
  contents: read

# PR runs cancel each other; main runs must finish so each commit gets its release.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.24.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Pull request: compile check only (frontend export + Go tests + host binary)
  # ---------------------------------------------------------------------------
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static export for Go embed)
        working-directory: frontend
        run: npm run build

      - name: Verify frontend dist
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/_next

      - name: Run Go tests
        run: go test ./...

      - name: Build control plane (linux/amd64)
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o spearhook-linux-amd64 .
          CGO_ENABLED=0 go build -ldflags="-s -w" -o spearhook-agent-linux-amd64 ./cmd/spearhook-agent
          ls -lh spearhook-linux-amd64 spearhook-agent-linux-amd64

  # ---------------------------------------------------------------------------
  # Push to main / tag push / manual dispatch: build every target and publish
  # a GitHub Release automatically.
  #   - tag push          -> release uses that tag
  #   - workflow_dispatch -> release uses inputs.version, else auto-bump
  #   - push to main      -> auto-bump the latest v* tag (v0.1.0 if none)
  # ---------------------------------------------------------------------------
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize publishing so two main pushes cannot compute the same next tag.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            tag="$INPUT_VERSION"
          else
            git fetch --tags --force --quiet
            latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            if [[ -z "$latest" ]]; then
              tag="v0.1.0"
            else
              core="${latest#v}"
              core="${core%%-*}"
              IFS=. read -r major minor patch <<<"$core"
              if ! [[ "${major:-}" =~ ^[0-9]+$ && "${minor:-}" =~ ^[0-9]+$ && "${patch:-}" =~ ^[0-9]+$ ]]; then
                echo "::error::Cannot auto-bump tag '$latest'. Run the workflow manually with an explicit version."
                exit 1
              fi
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static export for Go embed)
        working-directory: frontend
        run: npm run build

      - name: Verify frontend dist
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/_next

      - name: Run Go tests
        run: go test ./...

      - name: Cross-compile platform and agent binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          rm -rf release/*

          targets=(
            "linux amd64 spearhook-linux-amd64"
            "linux arm64 spearhook-linux-arm64"
            "windows amd64 spearhook-windows-amd64.exe"
            "windows arm64 spearhook-windows-arm64.exe"
            "darwin amd64 spearhook-macos-amd64"
            "darwin arm64 spearhook-macos-arm64"
          )

          for entry in "${targets[@]}"; do
            read -r os arch binary <<<"${entry}"
            echo "==> Building ${binary}"
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 \
              go build -ldflags="-s -w" -o "release/${binary}" main.go

            agent_binary="${binary/spearhook/spearhook-agent}"
            echo "==> Building ${agent_binary}"
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 \
              go build -ldflags="-s -w" -o "release/${agent_binary}" ./cmd/spearhook-agent
          done

          cp config.yaml.example release/config.yaml.example
          cp agent.yaml.example release/agent.yaml.example
          ls -lh release/

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mkdir -p archives

          # One archive per OS/arch with both binaries + example configs
          pairs=(
            "linux-amd64:spearhook-linux-amd64:spearhook-agent-linux-amd64"
            "linux-arm64:spearhook-linux-arm64:spearhook-agent-linux-arm64"
            "windows-amd64:spearhook-windows-amd64.exe:spearhook-agent-windows-amd64.exe"
            "windows-arm64:spearhook-windows-arm64.exe:spearhook-agent-windows-arm64.exe"
            "macos-amd64:spearhook-macos-amd64:spearhook-agent-macos-amd64"
            "macos-arm64:spearhook-macos-arm64:spearhook-agent-macos-arm64"
          )

          for pair in "${pairs[@]}"; do
            IFS=':' read -r name platform agent <<<"${pair}"
            staging="spearhook-${name}"
            mkdir -p "${staging}"
            cp "${platform}" "${agent}" config.yaml.example agent.yaml.example "${staging}/"
            if [[ "${name}" == windows-* ]]; then
              zip -r "archives/${staging}.zip" "${staging}"
            else
              tar -czf "archives/${staging}.tar.gz" "${staging}"
            fi
            rm -rf "${staging}"
          done

          ls -lh archives/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spearhook-binaries
          path: |
            release/spearhook-*
            release/spearhook-agent-*
            release/config.yaml.example
            release/agent.yaml.example
            release/archives/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Spearhook ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/archives/*
            release/config.yaml.example
            release/agent.yaml.example
